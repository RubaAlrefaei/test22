<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="1024" fill="#F4F1ED"/>

  <!-- Main card -->
  <rect x="72" y="44" width="1296" height="876" rx="42" fill="#FFFFFF"/>

  <!-- Left column -->
  <rect x="132" y="104" width="260" height="42" rx="21" fill="#E8F7FA"/>
  <text x="160" y="131" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#00ABC2">Gratis WoningScan · ± 2 minuten</text>

  <text x="132" y="218" font-family="Zilla Slab, Georgia, serif" font-size="56" font-weight="700" fill="#273338">Maak je woning</text>
  <text x="132" y="282" font-family="Zilla Slab, Georgia, serif" font-size="56" font-weight="700" fill="#00ABC2">meer waard</text>

  <text x="132" y="340" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#53636C">
    <tspan x="132" dy="0">Beantwoord een paar korte vragen en krijg inzicht in</tspan>
    <tspan x="132" dy="30">welke verbeteringen bij jouw woning passen en mogelijk</tspan>
    <tspan x="132" dy="30">kunnen bijdragen aan de woningwaarde.</tspan>
  </text>

  <text x="132" y="470" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#273338">Na de WoningScan krijg je inzicht in:</text>

  <!-- Check item 1 -->
  <circle cx="150" cy="521" r="16" fill="#EAF7F0"/>
  <path d="M143 521L148 526L157 516" stroke="#049B4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="528" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273338">relevante verbeteringen voor jouw woning</text>

  <!-- Check item 2 -->
  <circle cx="150" cy="570" r="16" fill="#EAF7F0"/>
  <path d="M143 570L148 575L157 565" stroke="#049B4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="577" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273338">mogelijke kansen voor je woningwaarde</text>

  <!-- Check item 3 -->
  <circle cx="150" cy="619" r="16" fill="#EAF7F0"/>
  <path d="M143 619L148 624L157 614" stroke="#049B4E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="626" font-family="Inter, Arial, sans-serif" font-size="18" fill="#273338">welke stappen je als eerste kunt overwegen</text>

  <!-- How it works -->
  <rect x="132" y="674" width="570" height="100" rx="18" fill="#F5FBFC"/>
  <text x="164" y="713" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#00ABC2">ZO WERKT HET</text>
  <text x="164" y="746" font-family="Inter, Arial, sans-serif" font-size="16" fill="#273338">Adres invullen → korte vragen → persoonlijk rapport</text>

  <!-- Divider -->
  <line x1="760" y1="122" x2="760" y2="842" stroke="#EEF1F2" stroke-width="2"/>

  <!-- Right column form -->
  <text x="820" y="178" font-family="Zilla Slab, Georgia, serif" font-size="38" font-weight="700" fill="#273338">Start met je woning</text>

  <text x="820" y="236" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#273338">Postcode *</text>
  <rect x="820" y="255" width="480" height="74" rx="18" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="2"/>
  <text x="846" y="301" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9AA7AE">1234 AB</text>

  <text x="820" y="382" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#273338">Huisnummer *</text>
  <text x="1068" y="382" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#273338">Toevoeging</text>

  <rect x="820" y="401" width="220" height="74" rx="18" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="2"/>
  <rect x="1068" y="401" width="232" height="74" rx="18" fill="#FFFFFF" stroke="#D7E0E4" stroke-width="2"/>
  <text x="846" y="447" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9AA7AE">123</text>
  <text x="1094" y="447" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9AA7AE">A</text>

  <text x="820" y="523" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667784">
    <tspan x="820" dy="0">We gebruiken je adres om openbare woninggegevens op te halen</tspan>
    <tspan x="820" dy="24">en de scan af te stemmen op jouw woning.</tspan>
  </text>

  <rect x="820" y="592" width="28" height="28" rx="6" fill="#FFFFFF" stroke="#8D9AA1" stroke-width="2"/>
  <text x="862" y="613" font-family="Inter, Arial, sans-serif" font-size="15" fill="#273338">Ik accepteer de</text>
  <text x="966" y="613" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#00ABC2">algemene voorwaarden</text>
  <text x="1117" y="613" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ED6B46">*</text>

  <rect x="820" y="655" width="480" height="82" rx="20" fill="#ED6B46"/>
  <text x="1060" y="706" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Start de gratis WoningScan</text>

  <!-- Footer -->
  <rect x="0" y="950" width="1440" height="74" fill="#273338"/>
  <rect x="0" y="950" width="1440" height="7" fill="#00ABC2"/>
  <text x="720" y="983" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Tsavo B.V.</text>
  <text x="720" y="1009" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#D9E0E3">Algemene voorwaarden · Privacy · Cookies · Contact</text>
</svg>
